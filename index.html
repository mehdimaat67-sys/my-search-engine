<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Custom Search Page</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #89b4fa;
        }
        .search-container {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            width: 350px;
            padding: 12px 16px;
            font-size: 1rem;
            border: 2px solid #45475a;
            border-radius: 8px;
            background-color: #313244;
            color: #cdd6f4;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #89b4fa;
        }
        button {
            padding: 12px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background-color: #89b4fa;
            color: #11111b;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #b4befe;
        }
    </style>
</head>
<body>

    <h1>My Custom Search Engine</h1>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Type your search here..." onkeypress="handleKeyPress(event)">
        <button onclick="performSearch()">Search</button>
    </div>

    <script>
        function performSearch() {
            const query = document.getElementById('searchInput').value;
            if (query.trim() !== '') {
                window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        }
    </script>

</body>
</html>
